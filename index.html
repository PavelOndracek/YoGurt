<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srdíčko pro tebe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<style>
/* Layout: one centered column. Pink greeting on top, the envelope below it; opening it lifts the photo out. */
:root{
  --bg:#ffeaf2;
  --accent:#ff3d7f;
  --accent-deep:#d4175f;
  --lilac:#cdb2ff;
  --paper:#fffafc;
  --display:'Pacifico','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#240a24;--accent:#ff5c93;--accent-deep:#ff7aa6;--lilac:#8e6fd8;--paper:#3a1840;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#240a24;--accent:#ff5c93;--accent-deep:#ff7aa6;--lilac:#8e6fd8;--paper:#3a1840;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);margin:0;
  padding-block:48px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;position:relative;min-height:100vh;
}
.bg-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg-hearts i{position:absolute;bottom:-40px;font-style:normal;color:var(--accent);opacity:.2;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center;min-height:calc(100vh - 112px);justify-content:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,13vw,4rem);line-height:1.2;margin:0;color:var(--accent-deep);text-wrap:balance}

/* envelope */
.stage{padding-top:150px}
.env{position:relative;width:260px;height:172px;border:0;background:none;padding:0;cursor:pointer;color:inherit;animation:wiggle 3s ease-in-out infinite}
.env.open{animation:none}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-3deg)}94%{transform:rotate(3deg)}98%{transform:rotate(-2deg)}}
.env:focus-visible{outline:3px solid var(--lilac);outline-offset:6px;border-radius:14px}
.env .body{position:absolute;inset:0;background:var(--accent);border-radius:12px;box-shadow:0 14px 30px rgba(255,61,127,.3);z-index:1}
.env .flap{position:absolute;left:0;right:0;top:0;height:104px;background:var(--accent-deep);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .7s ease;z-index:2}
.env.open .flap{transform:rotateX(180deg)}
.env .photo{
  position:absolute;left:50%;top:0;width:200px;height:200px;margin-left:-100px;z-index:3;
  opacity:0;transform:translateY(60px) scale(.45);transform-origin:50% 100%;
  transition:opacity .3s ease .35s,transform .9s cubic-bezier(.2,1.2,.4,1) .35s;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.25));pointer-events:none;user-select:none;
}
.env.open .photo{opacity:1;transform:translateY(-130px) scale(1)}
.env .pocket{position:absolute;inset:0;border-radius:12px;background:var(--accent-deep);clip-path:polygon(0 100%,0 30%,50% 68%,100% 30%,100% 100%);z-index:4}
.env .seal{position:absolute;left:50%;top:80px;width:36px;height:36px;margin-left:-18px;fill:var(--paper);z-index:5;transition:opacity .3s}
.env.open .seal{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.hint{margin:-12px 0 0;font-family:var(--display);font-size:1.5rem;color:var(--accent-deep);transition:opacity .3s}
.hint.gone{opacity:0}

/* tap hearts */
.pop-heart{position:fixed;pointer-events:none;z-index:50;color:var(--accent);line-height:1;animation:float 1.2s ease-out forwards}
@keyframes float{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot))}}

@media (prefers-reduced-motion: reduce){
  .bg-hearts i,.env{animation:none}
  .env .flap,.env .photo{transition:none}
}
</style>


</head>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // floating background hearts
  var bg = document.getElementById('bg');
  if(!reduce){
    for(var i=0;i<14;i++){
      var h=document.createElement('i');
      h.textContent='★';
      h.style.left=(Math.random()*100)+'%';
      h.style.fontSize=(14+Math.random()*30)+'px';
      h.style.animationDuration=(14+Math.random()*16)+'s';
      h.style.animationDelay=(-Math.random()*20)+'s';
      bg.appendChild(h);
    }
  }

  // heart burst
  function heart(x,y){
    var s=document.createElement('span');
    s.className='pop-heart';
    s.textContent='♥';
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',((Math.random()-.5)*120)+'px');
    s.style.setProperty('--dy',(-60-Math.random()*90)+'px');
    s.style.setProperty('--rot',((Math.random()-.5)*60)+'deg');
    s.style.fontSize=(18+Math.random()*22)+'px';
    document.body.appendChild(s);
    setTimeout(function(){s.remove()},1300);
  }
  document.addEventListener('pointerdown',function(e){
    if(reduce) return;
    heart(e.clientX,e.clientY);
  });

  // envelope
  var env=document.getElementById('env');
  env.addEventListener('click',function(){
    var open=env.classList.toggle('open');
    env.setAttribute('aria-expanded',open?'true':'false');
    document.getElementById('hint').classList.toggle('gone',open);
    if(open && !reduce){
      var r=env.getBoundingClientRect();
      for(var i=0;i<18;i++){
        (function(i){setTimeout(function(){
          heart(r.left+r.width/2+(Math.random()-.5)*260,r.top+(Math.random()-.5)*120);
        },i*45)})(i);
      }
    }
  });
})();
</script>
